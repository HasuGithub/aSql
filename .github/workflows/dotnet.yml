name: .NET Core Desktop

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    strategy:
      matrix:
        configuration: [Release]

    runs-on: windows-latest

    env:
      Solution_Name: aSql.sln

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # Installiert das .NET SDK auf dem Runner
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.401

    # Stellt alle NuGet-Pakete für das Projekt wieder her
    - name: Restore dependencies
      run: dotnet restore ${{ env.Solution_Name }}

    # 1. OUTPUT: Kompiliert das Hauptprojekt als eigenständige App (MIT .NET-Laufzeit)
    - name: Publish the Application (Self-Contained)
      run: dotnet publish AvaloniaUi/aSql.csproj -c ${{ matrix.configuration }} -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfContained=true -o ./publish-selfcontained

    # 2. OUTPUT: Kompiliert das Hauptprojekt als framework-abhängige App (OHNE .NET-Laufzeit)
    # Wichtig: Falls .NET 10 die Datei fälschlicherweise erzwingt, sorgt --no-self-contained für die korrekte Trennung.
    - name: Publish the Application (Framework-Dependent)
      run: dotnet publish AvaloniaUi/aSql.csproj -c ${{ matrix.configuration }} -r win-x64 --self-contained false --no-self-contained -p:PublishSingleFile=true -o ./publish-dependent

    # Erstellt ZIP-Archive aus den vollständigen Ausgabeordnern (inkl. aller Assemblys/DLLs)
    - name: Create Zip Archives for Release
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish-selfcontained/* -DestinationPath ./aSql-SelfContained.zip
        Compress-Archive -Path ./publish-dependent/* -DestinationPath ./aSql-Without-Dotnet.zip

    # Lädt das 1. Output (Vollständiger Ordner) als GitHub-Artefakt hoch
    - name: Upload Self-Contained Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Desktop-App-SelfContained
        path: ./publish-selfcontained

    # Lädt das 2. Output (Vollständiger Ordner) als GitHub-Artefakt hoch
    - name: Upload Framework-Dependent Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Desktop-App-Without-Dotnet
        path: ./publish-dependent

    # Erstellt das GitHub Release und lädt die vollständigen ZIP-Dateien hoch
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./aSql-SelfContained.zip
          ./aSql-Without-Dotnet.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
